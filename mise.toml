[tools]
node = "24"

[tasks.install]
run = "npm ci"

[tasks.build]
run = "npm run build"

[tasks.lint]
run = "npm run typecheck"

[tasks.test]
run = "npm test"

[tasks.dev]
run = "npm run dev"

[tasks.deploy]
description = "Build and deploy to AWS (private S3 + CloudFront OAC)"
run = "bash infra/deploy.sh"
